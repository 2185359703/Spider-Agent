services:
  mysql:
    image: mysql:8.0
    mem_limit: ${MYSQL_MEMORY_LIMIT:-768m}
    cpus: ${MYSQL_CPU_LIMIT:-1.0}
    environment:
      MYSQL_DATABASE: auto_spider
      MYSQL_USER: auto_spider
      MYSQL_PASSWORD: auto_spider
      MYSQL_ROOT_PASSWORD: local-root-password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "13306:3306"
    volumes:
      - auto-spider-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uauto_spider", "-pauto_spider"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}
    ports:
      - "16379:6379"
    volumes:
      - auto-spider-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    cpus: ${API_CPU_LIMIT:-0.5}
    build:
      context: .
      args:
        BASE_IMAGE: ${AUTO_SPIDER_BASE_IMAGE:-python:3.12-slim}
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://auto_spider:auto_spider@mysql:3306/auto_spider?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      COLLECTOR_SOURCE_REPO_PATH: /srv/collector-source
      AICODING_REPO_PATH: /srv/aicoding-collector
      EVIDENCE_ROOT: /srv/auto_spider/evidence
      WORKTREE_ROOT: /srv/auto_spider/worktrees
      OPENHANDS_SERVER_URL: http://openhands-agent-server:8000
      OPENHANDS_SESSION_API_KEY: ${OPENHANDS_SESSION_API_KEY:-local-openhands-session-key}
      OPENHANDS_LLM_MODEL: ${OPENHANDS_LLM_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      OPENHANDS_LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
      OPENHANDS_LLM_API_KEY: ${OPENHANDS_LLM_API_KEY:-}
      OPENHANDS_LLM_API_MODE: ${OPENHANDS_LLM_API_MODE:-auto}
      AGENT_MODE: ${AGENT_MODE:-openhands}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-browser}
    ports:
      - "18000:8000"
    volumes:
      - ./evidence:/srv/auto_spider/evidence
      - ./worktrees:/srv/auto_spider/worktrees
      - ${COLLECTOR_SOURCE_REPO_HOST_PATH:-.}:/srv/collector-source:ro
      - ${AICODING_REPO_HOST_PATH:-.}:/srv/aicoding-collector
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    mem_limit: ${WORKER_MEMORY_LIMIT:-1536m}
    cpus: ${WORKER_CPU_LIMIT:-1.0}
    build:
      context: .
      args:
        BASE_IMAGE: ${AUTO_SPIDER_BASE_IMAGE:-python:3.12-slim}
    command: ["celery", "-A", "auto_spider.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency", "${WORKER_CONCURRENCY:-1}", "--prefetch-multiplier", "1", "--max-tasks-per-child", "5", "-Q", "analysis,coding,validation,reporting,maintenance"]
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://auto_spider:auto_spider@mysql:3306/auto_spider?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      COLLECTOR_SOURCE_REPO_PATH: /srv/collector-source
      AICODING_REPO_PATH: /srv/aicoding-collector
      EVIDENCE_ROOT: /srv/auto_spider/evidence
      WORKTREE_ROOT: /srv/auto_spider/worktrees
      OPENHANDS_SERVER_URL: http://openhands-agent-server:8000
      OPENHANDS_SESSION_API_KEY: ${OPENHANDS_SESSION_API_KEY:-local-openhands-session-key}
      OPENHANDS_LLM_MODEL: ${OPENHANDS_LLM_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      OPENHANDS_LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
      OPENHANDS_LLM_API_KEY: ${OPENHANDS_LLM_API_KEY:-}
      OPENHANDS_LLM_API_MODE: ${OPENHANDS_LLM_API_MODE:-auto}
      AGENT_MODE: ${AGENT_MODE:-openhands}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-browser}
    volumes:
      - ./evidence:/srv/auto_spider/evidence
      - ./worktrees:/srv/auto_spider/worktrees
      - ${COLLECTOR_SOURCE_REPO_HOST_PATH:-.}:/srv/collector-source:ro
      - ${AICODING_REPO_HOST_PATH:-.}:/srv/aicoding-collector
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      openhands-agent-server:
        condition: service_healthy

  openhands-agent-server:
    mem_limit: ${AGENT_MEMORY_LIMIT:-2g}
    cpus: ${AGENT_CPU_LIMIT:-2.0}
    build:
      context: .
      dockerfile: docker/openhands-agent-server.Dockerfile
      args:
        BASE_IMAGE: ${OPENHANDS_BASE_IMAGE:-python:3.12-slim}
    command: ["python", "-m", "openhands.agent_server", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      OH_SESSION_API_KEYS_0: ${OPENHANDS_SESSION_API_KEY:-local-openhands-session-key}
      OH_SECRET_KEY: ${OPENHANDS_SECRET_KEY:-local-openhands-secret-key}
      LLM_MODEL: ${OPENHANDS_LLM_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      LLM_API_KEY: ${OPENHANDS_LLM_API_KEY:-}
      LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
      LLM_API_MODE: ${OPENHANDS_LLM_API_MODE:-}
    ports:
      - "18080:8000"
    volumes:
      - ./worktrees:/srv/auto_spider/worktrees
      - ./evidence:/srv/auto_spider/evidence
      # OpenHands must see the parent repository's .git/worktrees metadata.
      - ${AICODING_REPO_HOST_PATH:-.}:/srv/aicoding-collector
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  auto-spider-mysql:
  auto-spider-redis:
